spring:
  application:
    name: enlace
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/parcial_2_pa}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  factory: ${LINK_FACTORY:random}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
