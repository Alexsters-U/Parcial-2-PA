<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("enlace-theme") === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta
      name="description"
      content="Enlace: acorta tus URLs, conserva tus enlaces y compártelos de forma sencilla."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Enlace · Menos URL, más posibilidades</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
